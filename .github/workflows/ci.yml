name: CI Pipeline

on:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 18

      # 🔹 FRONTEND
      - name: Install & Build Frontend
        run: |
          cd frontend
          npm install
          npm run build

      # 🔹 BACKEND
      - name: Install Backend
        run: |
          cd backend
          npm install